# Publicar EcoYauh en https://render.com  (revisa su documentación; los planes pueden cambiar)
# IMPORTANTE: el plan "free" NO guarda archivos entre reinicios -> se pierden reportes y registros.
# Para uso real usa un plan de paga con disco (abajo) o descarga respaldos seguido desde Config.
services:
  - type: web
    name: ecoyauh
    runtime: node
    plan: free
    buildCommand: echo listo
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUCK_KEY
        generateValue: true
